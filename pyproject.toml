[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-commander-mcp"
version = "1.0.0"
description = "MCP server for Qt application introspection and automation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "psutil>=5.0",
]

[project.scripts]
qt-commander-mcp = "qt_commander.server:main"

[tool.setuptools.packages.find]
include = ["qt_commander*"]

[tool.setuptools.package-data]
qt_commander = ["native/**/*"]
