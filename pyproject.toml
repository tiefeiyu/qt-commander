[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-commander-mcp"
version = "0.1.0"
description = "MCP server for Qt application introspection and automation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TieFeiyu"}]
dependencies = [
    "fastmcp>=3.4.5",
    "psutil>=7.2.2",
]

[project.scripts]
qt-commander-mcp = "qt_commander.server:main"

[tool.setuptools.packages.find]
include = ["qt_commander*"]

[tool.setuptools.package-data]
qt_commander = ["native/**/*"]
