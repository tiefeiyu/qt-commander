[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-commander-mcp"
version = "2.0.0"
description = "MCP server for live Qt UI introspection and automation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TieFeiyu"}]
dependencies = [
    "fastmcp>=4.1.4",
    "psutil>=7.0",
]

[project.scripts]
qt-commander-mcp = "qt_commander.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["qt_commander*"]
