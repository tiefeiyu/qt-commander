[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-commander-mcp"
version = "0.1.0"
description = "MCP server for Qt application introspection and automation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TieFeiyu"}]
dependencies = [
    "fastmcp>=3.4.5",
    "psutil>=7.2.2",
]

[project.scripts]
qt-commander-mcp = "qt_commander.server:main"

# PEP 735 dev group. `uv sync` and `uv run` include it by default, so the
# documented test command works in a fresh checkout. Without it, `uv run
# pytest` finds no pytest in the project environment and silently falls
# back to whatever pytest happens to be on PATH, running the tests against
# an unrelated interpreter. pytest-asyncio backs the @pytest.mark.asyncio
# markers used throughout tests/unit_server/.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["qt_commander*"]

[tool.setuptools.package-data]
qt_commander = ["native/**/*"]
