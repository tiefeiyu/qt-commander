name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pytest tests/unit_server -q

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            qtbase5-dev qtdeclarative5-dev libgl1-mesa-dev
      - run: |
          cmake -S tests/test-apps/matrix -B build/ci -G Ninja \
            -DQT_MAJOR_VERSION=5 \
            -D_qt5gui_OPENGL_INCLUDE_DIR=/usr/include
          cmake --build build/ci
